<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6a643" />
  <meta name="description" content="Run the colourful streets in Gully Ka Badshah, a 3D endless runner." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Gully Ka Badshah</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
  </script>
</head>
<body>
  <main id="game" aria-label="Gully Ka Badshah endless runner">
    <canvas id="scene" aria-label="3D game scene"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <header class="hud" id="hud" hidden>
      <div class="hud-top">
        <div class="stat score"><small>SCORE</small><strong id="score">0</strong></div>
        <div class="stat"><small>BEST</small><strong id="best">0</strong></div>
        <div class="stat"><small>COINS</small><strong id="coins">0</strong></div>
        <button id="pause" class="icon-button" aria-label="Pause game">Ⅱ</button>
      </div>
      <div class="hud-bottom"><span id="theme">GULLY BAZAAR</span><span id="effects"></span><span id="distance">0 m</span></div>
    </header>
    <section id="menu" class="panel">
      <div class="title-kicker">A STREET-SMART RUNNER</div>
      <h1>GULLY KA<br><em>BADSHAH</em></h1>
      <p class="tagline">Apni gali. Apna raaj.</p>
      <div class="menu-stats"><span>🏆 <b id="menu-best">0</b> BEST</span><span>◉ 3-LANE RUN</span></div>
      <button id="play" class="primary">RUN THE GULLY <span>➜</span></button>
      <p class="controls-copy">SWIPE TO MOVE · ↑ JUMP · ↓ SLIDE<br><span>KEYBOARD: ← → / A D · W / SPACE · S</span></p>
      <button id="sound" class="sound-button" aria-label="Toggle sound">SOUND ON</button>
    </section>
    <section id="pause-panel" class="panel compact" hidden>
      <div class="title-kicker">CATCH YOUR BREATH</div><h2>PAUSED</h2>
      <button id="resume" class="primary">RESUME</button><button id="restart-pause" class="secondary">RESTART RUN</button><button id="sound-pause" class="secondary">SOUND ON</button><button id="home-pause" class="text-button">MAIN MENU</button>
    </section>
    <section id="over" class="panel compact" hidden>
      <div class="title-kicker">THE GULLY KEEPS GOING</div><h2>RUN OVER</h2>
      <div class="results"><div><small>SCORE</small><strong id="final-score">0</strong></div><div><small>COINS</small><strong id="final-coins">0</strong></div><div><small>DISTANCE</small><strong id="final-distance">0 m</strong></div></div>
      <button id="retry" class="primary">RUN IT BACK <span>↻</span></button><button id="home-over" class="text-button">MAIN MENU</button>
    </section>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="mobile-hints" id="mobile-hints" hidden><span>◀</span><span>JUMP ▲<br>SLIDE ▼</span><span>▶</span></div>
    <noscript>This game needs JavaScript enabled to run.</noscript>
  </main>
  <script type="module" src="./src/main.js"></script>
  <script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(error=>console.error('Service worker registration failed:',error)));</script>
</body>
</html>
